[tox]
envlist =
    py{38,39,310,311}-dj{32,42}
    py{312}-dj{42,52,60,61,main}
    py{313,314,315}-dj{52,60,61,main}

[testenv]
usedevelop = true
commands =
    pytest {posargs:tests} --cov=django_sitemaps --cov-report=term-missing
deps =
    pytest
    pytest-django
    pytest-cov
    dj32: Django>=3.2,<4.0
    dj42: Django>=4.2,<5.0
    dj52: Django>=5.2,<6.0
    dj60: Django>=6.0,<6.1
    dj61: Django>=6.1,<6.2
    djmain: https://github.com/django/django/archive/main.zip
